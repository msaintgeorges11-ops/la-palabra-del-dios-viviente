<script>
(function(){
var SHARE_URL='https://biblia-palabra-dios.com/hoy.html';
var NOCHE='<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="vertical-align:-5px"><defs><linearGradient id="nsk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1d4d"/><stop offset="1" stop-color="#2f62c0"/></linearGradient></defs><circle cx="12" cy="12" r="12" fill="url(#nsk)"/><g transform="translate(5.4 5.4) scale(.56)"><path fill="#ffe27a" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></g><g fill="#fff"><circle cx="17.8" cy="6.4" r=".85"/><circle cx="6.2" cy="7.2" r=".6"/><circle cx="19" cy="15.2" r=".6"/><circle cx="7.4" cy="17.6" r=".5"/><circle cx="13.5" cy="4.2" r=".5"/></g></svg>';
var WAI='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="vertical-align:-3px;margin-left:6px"><path fill="#25D366" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/><path fill="#fff" d="M8.5 7.5c-.3 0-.7.2-.9.6-.3.6-.4 1.4.2 2.5.9 1.7 2.4 3.2 4.2 4 1.2.5 2 .3 2.5-.4.2-.3.3-.6.2-.8l-1.6-.9c-.2-.1-.4 0-.5.1l-.5.6c-.5-.2-1.6-.9-2.2-1.9l.5-.6c.1-.2.1-.4 0-.5l-.8-1.7c-.1-.2-.3-.3-.5-.3z"/></svg>';
var B=[],EVT={},HOY=[],BK={},FL={},MES={};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function arr(v){return Array.isArray(v)?v:[v]}
function chunks(t){var o=[],c='';t.split(/(?<=[.!?:;])\s+/).forEach(function(s){if((c+' '+s).length>200&&c){o.push(c);c=s}else c=c?c+' '+s:s});if(c)o.push(c);return o}
function bookName(slug){for(var i=0;i<B.length;i++)if(B[i].s===slug)return B[i].n;return slug}
function parse(s){try{return JSON.parse(s)}catch(e){try{return (new Function('return '+s))()}catch(e2){return null}}}

// ---- Los datos se leen solos desde index.html (B, EVT, HOY) ----
function getIndex(){
  return fetch('/index.html',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.text()})
    .catch(function(){return fetch('/',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.text()})});
}
function readIndex(t){
  var a=t.match(/var B=(\[[\s\S]*?\]);\s*var A=/),b=t.match(/var EVT=(\{[\s\S]*?\});\s*var HOY=/),c=t.match(/var HOY=(\[[\s\S]*?\]);\s*(?:var NOCHE=|function bookName)/);
  if(!a||!b||!c)return false;
  B=parse(a[1])||[];EVT=parse(b[1])||{};HOY=parse(c[1])||[];
  return B.length>0&&HOY.length>0;
}

// ---- Biblia y meses ----
function loadBook(k,cb){
  if(k in BK){cb(BK[k]);return}
  var t='a';for(var i=0;i<B.length;i++)if(B[i].s===k)t=B[i].t;
  var f='/biblia-'+(t==='n'?'nt':'at')+'.json';
  if(FL[f]&&FL[f].d){BK[k]=FL[f].d[k]||[];cb(BK[k]);return}
  if(FL[f]){FL[f].q.push([k,cb]);return}
  FL[f]={q:[[k,cb]]};
  var done=function(d){FL[f].d=d;FL[f].q.forEach(function(x){BK[x[0]]=d[x[0]]||[];x[1](BK[x[0]])})};
  try{fetch(f).then(function(r){return r.ok?r.json():{}}).then(done).catch(function(){done({})})}catch(e){done({})}
}
function loadMes(k,cb){if(k in MES)return;MES[k]=null;try{fetch('/hoy-'+k+'.json').then(function(r){return r.ok?r.json():null}).then(function(j){if(j){MES[k]=j;cb()}}).catch(function(){})}catch(e){}}

// ---- Audio (igual que en las demás páginas) ----
var AQ=[],HQ=[],AS=0,AI=0,AT=0,AU=null,AR=null,GEN=false,MP=null,MPK='',RT=.92,PT=1,VSEL='',SRC='';
try{VSEL=localStorage.getItem('vozNom')||'';SRC=localStorage.getItem('vozSrc')||''}catch(e){}
if(SRC==='piper')SRC='';
var MAL=/\b(jorge|juan|pablo|raul|raúl|alvaro|álvaro|diego|carlos|enrique|miguel|male|hombre|masculin|andres|andrés|antonio|gonzalo|tomas|tomás|santiago|alberto|pedro)\b/i;
var FEM=/(female|mujer|femenin|helena|laura|sabina|elvira|dalia|paloma|monica|mónica|paulina|lucia|lucía|marisol|esperanza|ximena|camila|paola|elena|catalina|angelica|angélica|francisca)/i;
function esV(){try{var v=speechSynthesis.getVoices().filter(function(x){return /^es/i.test(x.lang.replace('_','-'))});v.sort(function(a,b){var r=function(x){return /es[-_]ES/i.test(x.lang)?0:(/es[-_](MX|US|419)/i.test(x.lang)?1:2)};return r(a)-r(b)});return v}catch(e){return[]}}
function vK(v){return MAL.test(v.name)?0:(FEM.test(v.name)?2:1)}
function vL(){return esV().map(function(v,i){return{v:v,i:i}}).sort(function(a,b){return(vK(a.v)-vK(b.v))||(a.i-b.i)}).map(function(x){return x.v})}
function vId(v){return v.voiceURI||v.name}
function vLab(v){var k=vK(v),ic=k===0?'👨 ':(k===2?'👩 ':'🎙 ');return ic+v.name.replace(/^(Google|Microsoft)\s+/i,'')+' · '+v.lang.replace('_','-')}
function aVoice(){var a=vL();if(!a.length)return null;var v=VSEL&&a.filter(function(x){return vId(x)===VSEL})[0];return v||a[0]}
function src(){var s=SRC;if(s==='mp3'&&!MP)s='';if(s==='gen'&&!GEN)s='';if(s==='mp3'||s==='gen')return s;if(MP&&!SRC)return 'mp3';return GEN?'gen':'tel'}
function GURL(t){return '/api/tts?t='+encodeURIComponent(t)}
function sv(k,v){try{localStorage.setItem(k,v)}catch(e){}}
try{fetch('/api/tts?ping=1').then(function(r){return r.ok?r.json():null}).then(function(j){if(j&&j.ok){GEN=true;fill()}}).catch(function(){})}catch(e){}
function upd(){var b=document.getElementById('aPlay');if(b)b.textContent=AS?(AS===1?'⏹ Parar':'▶ Continuar'):'🔊 Escuchar'}
function fill(){
  var sel=document.getElementById('aSel');if(!sel)return;sel.innerHTML='';
  var add=function(v,t){var o=document.createElement('option');o.value=v;o.textContent=t;sel.appendChild(o)};
  if(MP)add('mp3','🎧 Voz natural (grabada)');
  if(GEN)add('gen','🎙 Voz clonada (generada)');
  var L=vL();L.forEach(function(v){add(vId(v),vLab(v))});if(!L.length&&!GEN&&!MP)add('','🔊 Voz del teléfono');
  var s=src(),want=(s==='mp3'||s==='gen')?s:(VSEL||(L[0]?vId(L[0]):''));sel.value=want;if(sel.value!==want&&sel.options.length)sel.selectedIndex=0;upd();
}
function speak(){
  if(AS!==1)return;if(AI>=AQ.length){stop();return}
  var it=AQ[AI];
  if(it.p){if(AR)AR.classList.remove('rd');AR=it.p;AR.classList.add('rd');try{AR.scrollIntoView({block:'center',behavior:'smooth'})}catch(e){}}
  if(src()==='gen'){
    var g=new Audio(GURL(it.t));AU=g;
    g.onended=function(){if(AU===g&&AS===1){AU=null;AI++;speak()}};
    g.onerror=function(){if(AU!==g)return;AU=null;GEN=false;fill();if(AS===1)speak()};
    var p=g.play();if(p&&p.catch)p.catch(function(){});
    var n=AQ[AI+1];if(n){try{fetch(GURL(n.t)).catch(function(){})}catch(e){}}
    return;
  }
  var tk=++AT,u=new SpeechSynthesisUtterance(it.t),v=aVoice();u.lang='es-ES';
  if(v){u.voice=v;u.lang=v.lang}u.rate=RT;u.pitch=PT;
  var nx=function(){if(AS===1&&tk===AT){AI++;speak()}};u.onend=nx;u.onerror=nx;speechSynthesis.speak(u);
}
function stop(){AS=0;AI=0;AT++;if(AU){var a=AU;AU=null;try{a.pause()}catch(e){}}try{speechSynthesis.cancel()}catch(e){}if(AR){AR.classList.remove('rd');AR=null}upd()}
function play(){
  var s=src();
  if(s!=='gen'&&s!=='mp3'&&!('speechSynthesis' in window)){alert('Tu navegador no permite el audio.');return}
  if(AS===1){AS=2;AT++;if(AU)AU.pause();else speechSynthesis.cancel();upd();return}
  if(AS===2){AS=1;upd();if(AU){var pr=AU.play();if(pr&&pr.catch)pr.catch(function(){})}else speak();return}
  AS=1;AI=0;
  if(s==='mp3'){
    var a=new Audio(MP);AU=a;a.onended=function(){if(AU===a)stop()};
    a.onerror=function(){if(AU!==a)return;stop();MP=null;fill();play()};
    var pl=a.play();if(pl&&pl.catch)pl.catch(function(){});
  }else{AQ=HQ;speak()}
  upd();
}
try{speechSynthesis.onvoiceschanged=fill}catch(e){}
setTimeout(fill,600);setTimeout(fill,2000);
window.addEventListener('pagehide',stop);

// ---- Pintar el artículo ----
function render(){
  var box=document.getElementById('art');if(!box)return;
  stop();
  var now=new Date(),d=new Date(now),hr=now.getHours(),pm=(hr>=17||hr<5)?1:0;if(hr<5)d.setDate(d.getDate()-1);var day=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
  var key=('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2),ev=EVT[key],ym=d.getFullYear()+'-'+key.slice(0,2),mo=MES[ym],dd=mo&&mo[key.slice(3)],fx=dd&&dd[pm?'t':'m'],x=fx||((!pm&&ev)?ev:HOY[(day*2+pm)%HOY.length]);
  loadMes(ym,function(){if(AS===0)render()});
  var mk=d.getFullYear()+'-'+key+'-'+(pm?'t':'m');
  if(MPK!==mk){MPK=mk;MP=null;try{var mu='/audio/'+mk+'.mp3';fetch(mu,{method:'HEAD'}).then(function(r){var ct=r.headers.get('content-type')||'';if(r.ok&&!/text\/html/i.test(ct)&&MPK===mk){MP=mu;fill()}}).catch(function(){})}catch(e){}}
  var need=x.v.slice(0,2).map(function(r){return r.split(' ')[0]}).filter(function(k){return !(k in BK)});
  if(need.length){
    box.innerHTML='';box.appendChild(el('h1',null,'📰 Artículo de hoy'));box.appendChild(el('p','s','Cargando…'));
    var left=need.length;need.forEach(function(k){loadBook(k,function(){if(--left===0)render()})});return;
  }
  var open=pm?'Gracias, Señor, por este día; nos hiciste pasar bien la jornada. ':'Gracias, Señor, por esta nueva mañana y por la noche que me hiciste pasar bien. ';
  var f=d.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'}),words=0;
  document.title='📰 '+x.t+' · Artículo de hoy | La Palabra del Dios Viviente';
  box.innerHTML='';HQ=[];
  box.appendChild(el('h1',null,'📰 Artículo de hoy'));
  var sb=el('p','s');sb.innerHTML=f.charAt(0).toUpperCase()+f.slice(1)+' · '+(pm?NOCHE+' Esta noche':'🌅 Esta mañana');box.appendChild(sb);
  box.appendChild(el('p','s tm','Tema: '+x.t));HQ.push({t:'Artículo de hoy. '+(pm?'Esta noche.':'Esta mañana.')},{t:f.charAt(0).toUpperCase()+f.slice(1)+'.'},{t:'Tema: '+x.t+'.'});
  var au=el('div','aud'),bt=el('button','aBtn','🔊 Escuchar');bt.type='button';bt.id='aPlay';bt.onclick=play;au.appendChild(bt);
  var sl=el('select','vsel');sl.id='aSel';sl.setAttribute('aria-label','Voz');
  sl.onchange=function(){
    if(sl.value==='mp3'||sl.value==='gen')SRC=sl.value;else{SRC='tel';VSEL=sl.value;sv('vozNom',VSEL)}sv('vozSrc',SRC);
    var was=AS===1;stop();fill();if(was)play();
  };
  au.appendChild(sl);
  var ST='📰 '+x.t+' · La Palabra del Dios Viviente';
  var wt=el('a','aBtn');wt.innerHTML='📲 Compartir por WhatsApp'+WAI;wt.href='https://wa.me/?text='+encodeURIComponent(ST+'\n'+SHARE_URL);wt.target='_blank';wt.rel='noopener noreferrer';wt.style.cssText='display:block;text-align:center;text-decoration:none;background:#fff;border-color:#f7b82c;box-shadow:none;padding:6px 22px;font-size:13px';
  
  var dur=el('p','s','');au.appendChild(dur);box.appendChild(au);
  var vh=el('h2',null,'📖 Versículos de hoy');box.appendChild(vh);HQ.push({t:'Versículos de hoy.',p:vh});
  x.v.slice(0,2).forEach(function(r){
    var m=r.match(/^(\S+) (\d+):(\d+)(?:-(\d+))?$/);if(!m)return;
    var k=m[1],c=+m[2],a=+m[3],b=+(m[4]||m[3]),t=[];
    for(var i=a;i<=b;i++){var T=BK[k];if(T&&T[c-1]&&T[c-1][i-1])t.push(T[c-1][i-1])}
    var lab=bookName(k)+' '+c+':'+a+(b>a?'-'+b:''),w=el('p');w.appendChild(el('b',null,lab+' '));
    w.appendChild(document.createTextNode(t.join(' ')));box.appendChild(w);
    var tx=t.join(' ').replace(/[\[\]]/g,'');words+=tx.split(/\s+/).length;
    HQ.push({t:bookName(k)+', capítulo '+c+', versículo'+(b>a?'s '+a+' al '+b:' '+a)+'.'});chunks(tx).forEach(function(z){HQ.push({t:z,p:w})});
  });
  function sec(title,v,pre){
    box.appendChild(el('h2',null,title));HQ.push({t:title.replace(/^\S+\s/,'')+'.'});
    arr(v).forEach(function(t,i){var z=(i===0&&pre?pre:'')+t,p=el('p',null,z);box.appendChild(p);words+=z.split(/\s+/).length;chunks(z).forEach(function(c){HQ.push({t:c,p:p})})});
  }
  sec('🙏 Oración de hoy',x.o,open);
  sec((x===ev||x.e)?'📅 Un día como hoy':'📚 Historia de hoy',x.h);
  if(pm&&ev&&!fx)sec('📅 Un día como hoy',ev.h);
  sec('✝️ Mensaje de hoy',x.m);
  dur.textContent='⏱ Duración aproximada: '+Math.max(1,Math.round(words/150))+' min';

  // Compartir
  box.appendChild(el('h2','sm','Compartir este artículo'));
  var wa=el('a','go');wa.innerHTML='📲 Compartir por WhatsApp'+WAI;wa.target='_blank';wa.rel='noopener noreferrer';
  wa.href='https://wa.me/?text='+encodeURIComponent(ST+'\n'+SHARE_URL);box.appendChild(wa);
  var cp=el('button','go alt','📋 Copiar enlace para compartir');cp.type='button';
  cp.onclick=function(){
    var ok=function(){cp.textContent='✅ Enlace copiado';setTimeout(function(){cp.textContent='📋 Copiar enlace para compartir'},2500)},
        fb=function(){var ta=document.createElement('textarea');ta.value=SHARE_URL;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(e){}document.body.removeChild(ta)};
    try{navigator.clipboard.writeText(SHARE_URL).then(ok,fb)}catch(e){fb()}
  };
  box.appendChild(cp);

  // Solo para ti: hoy.html?admin → copiar texto para ElevenLabs
  if(/[?&]admin\b/.test(location.search)){
    var cb=el('button','go alt','📋 Copiar texto para ElevenLabs');cb.type='button';
    cb.onclick=function(){var t=HQ.map(function(i){return i.t}).join(' '),ok=function(){cb.textContent='✅ Copiado'},fb=function(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(e){}document.body.removeChild(ta)};
      try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}};
    box.appendChild(cb);box.appendChild(el('p','s','Guarda el MP3 como: audio/'+mk+'.mp3'));
  }
  fill();
  var nx=[5,17].map(function(h){var t=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,0,1);if(t<=now)t.setDate(t.getDate()+1);return t}).sort(function(a,b){return a-b})[0];
  clearTimeout(render.t);render.t=setTimeout(render,Math.max(1000,nx-new Date()));
}

function fail(){
  var box=document.getElementById('art');box.innerHTML='';
  box.appendChild(el('h1',null,'📰 Artículo de hoy'));
  box.appendChild(el('p','s','No se pudo cargar el artículo. Inténtalo de nuevo en un momento.'));
}
getIndex().then(function(t){if(readIndex(t))render();else fail()}).catch(fail);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&AS===0&&HOY.length)render()});
})();
